<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="jarShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <path id="topCurve" d="M 26,118 A 94,94 0 0,1 214,118"/>
  </defs>

  <!-- Badge background -->
  <circle cx="120" cy="120" r="116" fill="#1a0d04"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#c8763a" stroke-width="5"/>
  <circle cx="120" cy="120" r="106" fill="none" stroke="#c8763a"
          stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- Lid knob -->
  <ellipse cx="120" cy="74" rx="14" ry="8"
           fill="#964820" stroke="#5c2e0e" stroke-width="2"/>

  <!-- Lid -->
  <rect x="68" y="79" width="104" height="21" rx="7"
        fill="#b86030" stroke="#5c2e0e" stroke-width="2.5"/>

  <!-- Jar body -->
  <rect x="75" y="97" width="90" height="83" rx="11"
        fill="#e5b96a" stroke="#5c2e0e" stroke-width="2.5"/>

  <!-- Jar shine -->
  <rect x="79" y="101" width="20" height="71" rx="7"
        fill="url(#jarShine)"/>

  <!-- Cookie (left) -->
  <circle cx="103" cy="129" r="16"
          fill="#c87038" stroke="#5c2e0e" stroke-width="1.8"/>
  <circle cx="98"  cy="124" r="2.7" fill="#2a0e05"/>
  <circle cx="108" cy="125" r="2.7" fill="#2a0e05"/>
  <circle cx="100" cy="134" r="2.7" fill="#2a0e05"/>
  <circle cx="109" cy="133" r="2.2" fill="#2a0e05"/>

  <!-- Cookie (right) -->
  <circle cx="136" cy="133" r="13"
          fill="#c87038" stroke="#5c2e0e" stroke-width="1.8"/>
  <circle cx="132" cy="129" r="2.3" fill="#2a0e05"/>
  <circle cx="140" cy="130" r="2.3" fill="#2a0e05"/>
  <circle cx="134" cy="138" r="2.3" fill="#2a0e05"/>

  <!-- Brand name -->
  <text x="120" y="197" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-weight="bold"
        fill="#e5b96a" letter-spacing="2">ProwseTk</text>

  <!-- Curved top label -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="10.5"
        fill="#c8763a" font-weight="bold" letter-spacing="3">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      PROGRAMMATIC BROWSER
    </textPath>
  </text>
</svg>
