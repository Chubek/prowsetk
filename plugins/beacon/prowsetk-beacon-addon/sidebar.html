<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ProwseTk Beacon</title>
<style>
body { font-family: sans-serif; margin: 8px; }
button { display: block; width: 100%; margin: 4px 0; }
#flashes { list-style: none; padding: 0; }
#flashes li { border: 1px solid #ccc; margin: 4px 0; padding: 4px; }
</style>
</head>
<body>
<h1>ProwseTk Beacon</h1>
<p id="status" role="status" aria-live="polite">Disconnected</p>
<button id="list">List Flashes</button>
<button id="connect">Connect to Flash</button>
<button id="send-page">Send Page</button>
<button id="send-network">Send Network Info</button>
<button id="send-stylesheet">Send Stylesheet</button>
<button id="tracepoint">Set Tracepoint</button>
<button id="disconnect">Disconnect</button>
<ul id="flashes"></ul>
<script src="sidebar.js"></script>
</body>
</html>
