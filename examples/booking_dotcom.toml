[project]
name = "booking-dotcom"
root = ".."

[[drivers]]
name = "booking-dotcom"
script = "examples/booking-dotcom/scrape_booking_dotcom.lua"
entrypoint = "main"
enabled = true
description = "Scrape admin.booking.com endpoints after authentication"
arguments = [
  { name = "output", type = "path", required = false, description = "OpenAPI YAML output path; defaults to $HOME/booking-dotcom/BookingDotcomAdminPanel.yaml" },
  { name = "postman", type = "path", required = false, description = "Postman Collection JSON output path (derived from output if not specified)" },
  { name = "dotenv", type = "path", required = false, description = "Path to .env file containing BOOKING_DOTCOM_USER, BOOKING_DOTCOM_PASS, and optional BOOKING_DOTCOM_AS_TOKEN" },
  { name = "success_selector", type = "string", required = false, description = "CSS selector to detect successful authentication" },
  { name = "max_depth", type = "integer", required = false, default = "2", description = "Maximum crawl depth for recursive page scraping" },
  { name = "max_pages", type = "integer", required = false, default = "12", description = "Maximum number of pages to scrape" },
  { name = "max_api_depth", type = "integer", required = false, default = "2", description = "Maximum recursive depth for JSON API endpoint resolution" },
  { name = "max_api_requests", type = "integer", required = false, default = "128", description = "Maximum API endpoint requests made while resolving JSON chains" },
  { name = "html", type = "string", required = false, secret = false, description = "HTML content for offline testing (bypasses network and authentication)" }
]
