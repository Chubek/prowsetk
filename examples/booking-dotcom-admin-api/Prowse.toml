[project]
name = "booking-dotcom-admin-api"
root = "."

# The driver's snapshot Session stays headless and never re-executes scripts
# captured from the assistant browser.
[engine]
javascript = false

[assistant-browser]
enabled = true
command = "qutebrowser"
method = "qutebrowser-userscript"
wait_timeout_ms = 30000

# Optional snapshot source via plugins/browser-run-integration (Cloudflare
# hosted Chromium). Leave commented for the default Qutebrowser workflow.
# Control credentials prefer the environment (CLOUDFLARE_ACCOUNT_ID /
# CLOUDFLARE_API_TOKEN override these values); never commit a real token.
# [cloudflare]
# account_id = ""
# api_token = ""

[[drivers]]
name = "booking-admin-api"
description = "Extract a Qutebrowser admin snapshot; optionally run two-way DOM actions"
script = "api.lua"
entrypoint = "main"
arguments = [
  { name = "url", type = "url", default = "https://admin.booking.com/" },
  { name = "html", type = "string" },
  { name = "bridge", type = "path" },
  { name = "ipc_module", type = "path" },
  { name = "wait_ms", type = "integer", default = 30000 },
  { name = "success_selector", type = "string", default = "a[href*='logout'], [data-testid='account-menu']" },
  { name = "success_xpath", type = "string" },
  { name = "actions_file", type = "path" },
  { name = "api_only", type = "boolean", default = true },
  { name = "output", type = "path", default = "_scraped/booking-admin-openapi.yaml" },
  { name = "postman", type = "path", default = "_scraped/booking-admin-postman.json" }
]
