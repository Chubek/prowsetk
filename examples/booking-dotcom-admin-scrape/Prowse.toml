[project]
name = "booking-dotcom-admin-scrape"
version = "0.1.0"
description = "Scrape heuristic endpoint specifications from admin.booking.com"
root = "."

[engine]
javascript = true
headless = true
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
follow_redirects = false
observe_network = false

[lua]
version = "5.4"
libraries = ["lprowse", "lprowsext"]
allow_extensions = true
execution_timeout_ms = 60000

[assistant-browser]
enabled = true
command = "firefox"
method = "manual"
endpoint = ""
debug_port = 0
wait_timeout_ms = 300000

[logging]
level = "info"
format = "text"
redact_sensitive_data = true

[output]
directory = "_scraped/booking-dotcom-admin"
create_directories = true
overwrite = true
formats = ["yaml", "json"]

[[plugins]]
name = "ebpf-interface"
description = "Optional libbpf/eBPF endpoint observation for host-mediated page traffic"
type = "native"
path = "../../build/default/plugins/ebpf-interface/libprowsetk_ebpf_interface.so"
enabled = true
autoload = true
capabilities = [
    "ebpf",
    "libbpf",
    "endpoint-observation",
    "network-tracing",
    "bpf-object",
    "bpf-program",
    "bpf-map",
    "bpf-link",
    "ring-buffer",
    "perf-buffer"
]

[[plugins]]
name = "captcha-handler"
description = "Detect Booking.com anti-bot challenges and expose host-mediated handling plans"
type = "native"
path = "../../build/default/plugins/captcha-handler/libprowsetk_captcha_handler.so"
enabled = true
autoload = true
capabilities = [
    "captcha-handling",
    "anti-bot-detection",
    "cookie-session-reuse",
    "pre-solved-token",
    "wait-for-clearance",
    "abort-and-report"
]

[[plugins]]
name = "restful-resolver"
description = "Resolve scraped endpoints iteratively until a full RESTful API surface (GET+POST) is discovered"
type = "native"
path = "../../build/default/plugins/restful-resolver/libprowsetk_restful_resolver.so"
enabled = true
autoload = true
capabilities = [
    "restful-resolution",
    "endpoint-discovery",
    "openapi-yaml",
    "post-discovery"
]

[[plugins]]
name = "schema-grabber"
description = "Reverse-engineer request/response schemas and URL parameters for scraped endpoints"
type = "native"
path = "../../build/default/plugins/schema-grabber/libprowsetk_schema_grabber.so"
enabled = true
autoload = true
capabilities = [
    "schema-inference",
    "endpoint-discovery",
    "openapi-yaml",
    "postman-json",
    "url-parameters"
]

[[plugins]]
name = "beacon"
description = "Firefox network oracle: merge user-consented Beacon network Flash results"
type = "native"
path = "../../build/default/plugins/beacon/libprowsetk_beacon.so"
enabled = true
autoload = true
capabilities = [
    "beacon-oracle",
    "flash-lifecycle",
    "network-info"
]

[[drivers]]
name = "crawl-site"
description = "Crawl admin.booking.com pages and collect page metadata as JSONL (generic drivers/crawl_site.lua)"
script = "../../drivers/crawl_site.lua"
entrypoint = "main"
enabled = true

arguments = [
    { name = "url", type = "url", required = false, default = "https://admin.booking.com/" },
    { name = "depth", type = "integer", required = false, default = 2 },
    { name = "output", type = "path", required = false, default = "_scraped/booking-dotcom-admin/pages.jsonl" },
    { name = "html", type = "string", required = false, default = "" }
]

[[drivers]]
name = "booking-dotcom-admin"
description = "Login to admin.booking.com and recursively scrape heuristic endpoints"
script = "scrape-booking-dotcom-admin.lua"
entrypoint = "main"
enabled = true

arguments = [
    { name = "url", type = "url", required = false, default = "https://admin.booking.com/" },
    { name = "dotenv", type = "path", required = false, default = ".env" },
    { name = "output_dir", type = "path", required = false, default = "_scraped/booking-dotcom-admin" },
    { name = "output", type = "path", required = false, default = "_scraped/booking-dotcom-admin/BookingDotcomAdminPanel.yaml" },
    { name = "postman", type = "path", required = false, default = "_scraped/booking-dotcom-admin/BookingDotcomAdminPanel.postman_collection.json" },
    { name = "ebpf_output", type = "path", required = false, default = "_scraped/booking-dotcom-admin/ebpf-endpoints.json" },
    { name = "max_depth", type = "integer", required = false, default = 2 },
    { name = "max_pages", type = "integer", required = false, default = 100 },
    { name = "max_api_depth", type = "integer", required = false, default = 2 },
    { name = "max_api_requests", type = "integer", required = false, default = 64 },
    { name = "max_resolve_rounds", type = "integer", required = false, default = 4 },
    { name = "max_schema_probes", type = "integer", required = false, default = 32 },
    { name = "success_selector", type = "string", required = false, default = "" },
    { name = "success_beacon", type = "string", required = false, default = "" },
    { name = "success_beacon_type", type = "string", required = false, default = "auto" },
    { name = "clearance_cookie", type = "string", required = false, default = "", secret = true },
    { name = "captcha_token", type = "string", required = false, default = "", secret = true },
    { name = "assistant_browser_force", type = "boolean", required = false, default = false },
    { name = "assistant_browser_cookie_command", type = "string", required = false, default = "" },
    { name = "no-xcors", type = "boolean", required = false, default = false },
    { name = "no_xcors", type = "boolean", required = false, default = false },
    { name = "api-only", type = "boolean", required = false, default = true },
    { name = "api_only", type = "boolean", required = false, default = true },
    { name = "script_origins", type = "string", required = false, default = "bstatic.com" },
    { name = "beacon_socket", type = "string", required = false, default = "" },
    { name = "flash-on", type = "boolean", required = false, default = false },
    { name = "flash_on", type = "boolean", required = false, default = false },
    { name = "beacon_url_pattern", type = "string", required = false, default = "" },
    { name = "beacon_binary", type = "string", required = false, default = "" },
    { name = "beacon_json", type = "string", required = false, default = "" },
    { name = "beacon_max_polls", type = "integer", required = false, default = 10 },
    { name = "beacon_poll_sleep", type = "integer", required = false, default = 2 },
    { name = "opencode", type = "boolean", required = false, default = false },
    { name = "opencode_enabled", type = "boolean", required = false, default = false },
    { name = "opencode-json", type = "string", required = false, default = "" },
    { name = "opencode_json", type = "string", required = false, default = "" },
    { name = "opencode_module", type = "string", required = false, default = "" },
    { name = "opencode-module", type = "string", required = false, default = "" },
    { name = "opencode_base_url", type = "string", required = false, default = "" },
    { name = "opencode-base-url", type = "string", required = false, default = "" },
    { name = "opencode_max_endpoints", type = "integer", required = false, default = 200 },
    { name = "opencode-max-endpoints", type = "integer", required = false, default = 200 },
    { name = "opencode_max_requests", type = "integer", required = false, default = 32 },
    { name = "opencode-max-requests", type = "integer", required = false, default = 32 },
    { name = "opencode_timeout_ms", type = "integer", required = false, default = 30000 },
    { name = "opencode-timeout-ms", type = "integer", required = false, default = 30000 },
    { name = "opencode_wait_ms", type = "integer", required = false, default = 120000 },
    { name = "opencode-wait-ms", type = "integer", required = false, default = 120000 },
    { name = "opencode_api_prefix", type = "string", required = false, default = "/api" },
    { name = "opencode-api-prefix", type = "string", required = false, default = "/api" },
    { name = "opencode_instructions", type = "string", required = false, default = "" },
    { name = "opencode-instructions", type = "string", required = false, default = "" },
    { name = "opencode_allow_remote_http", type = "boolean", required = false, default = false },
    { name = "opencode_output", type = "path", required = false, default = "" },
    { name = "opencode-output", type = "path", required = false, default = "" },
    { name = "html", type = "string", required = false, default = "" }
]
