[project]
name = "booking-dotcom-admin-scrape"
version = "0.1.0"
description = "Scrape heuristic endpoint specifications from admin.booking.com"
root = "."

[engine]
javascript = true
headless = true
user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
follow_redirects = false
observe_network = false

[lua]
version = "5.4"
libraries = ["lprowse", "lprowsext"]
allow_extensions = true
execution_timeout_ms = 60000

[sessions]
cookies_json = "../../_scraped/booking-dotcom-admin/cookies.json"

[assistant-browser]
enabled = true
command = "assistant-browser"
method = "webdriver"
endpoint = ""
debug_port = 0
wait_timeout_ms = 300000

[logging]
level = "info"
format = "text"
redact_sensitive_data = true

[output]
directory = "_scraped/booking-dotcom-admin"
create_directories = true
overwrite = true
formats = ["yaml", "json"]

[[plugins]]
name = "captcha-handler"
description = "Detect Booking.com anti-bot challenges and expose host-mediated handling plans"
type = "native"
path = "../../build/default/plugins/captcha-handler/libprowsetk_captcha_handler.so"
enabled = true
autoload = true
capabilities = [
    "captcha-handling",
    "anti-bot-detection",
    "cookie-session-reuse",
    "pre-solved-token",
    "wait-for-clearance",
    "abort-and-report"
]

[[drivers]]
name = "booking-dotcom-admin"
description = "Login to admin.booking.com and recursively scrape heuristic endpoints"
script = "scrape-booking-dotcom-admin.lua"
entrypoint = "main"
enabled = true

arguments = [
    { name = "url", type = "url", required = false, default = "https://admin.booking.com/" },
    { name = "dotenv", type = "path", required = false, default = ".env" },
    { name = "output_dir", type = "path", required = false, default = "_scraped/booking-dotcom-admin" },
    { name = "output", type = "path", required = false, default = "_scraped/booking-dotcom-admin/BookingDotcomAdminPanel.yaml" },
    { name = "postman", type = "path", required = false, default = "_scraped/booking-dotcom-admin/BookingDotcomAdminPanel.postman_collection.json" },
    { name = "max_depth", type = "integer", required = false, default = 2 },
    { name = "max_pages", type = "integer", required = false, default = 100 },
    { name = "max_api_depth", type = "integer", required = false, default = 2 },
    { name = "max_api_requests", type = "integer", required = false, default = 64 },
    { name = "success_selector", type = "string", required = false, default = "" },
    { name = "clearance_cookie", type = "string", required = false, default = "", secret = true },
    { name = "captcha_token", type = "string", required = false, default = "", secret = true },
    { name = "html", type = "string", required = false, default = "" }
]
